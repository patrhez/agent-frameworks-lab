[project]
name = "lab-langgraph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
